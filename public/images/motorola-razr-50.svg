<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="razr-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Body -->
  <rect x="95" y="30" width="210" height="440" rx="30" fill="url(#razr-body)" stroke="#60A5FA" stroke-width="2.5"/>
  <rect x="99" y="34" width="202" height="432" rx="26" fill="#1E3A8A"/>
  
  <!-- Full Top Half Outer 4.0" Screen -->
  <rect x="105" y="45" width="190" height="200" rx="20" fill="#0A0F1D" stroke="#3B82F6" stroke-width="2"/>
  
  <!-- Dual Cameras cut into cover screen -->
  <circle cx="140" cy="80" r="14" fill="#000" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="178" cy="80" r="14" fill="#000" stroke="#60A5FA" stroke-width="2"/>
  
  <!-- Hinge Line -->
  <line x1="95" y1="250" x2="305" y2="250" stroke="#93C5FD" stroke-width="3"/>
  
  <text x="200" y="430" fill="#DBEAFE" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">RAZR 50 ULTRA</text>
</svg>
