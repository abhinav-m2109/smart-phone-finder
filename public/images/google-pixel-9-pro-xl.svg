<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pixel-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="visor-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="50%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Body -->
  <rect x="95" y="30" width="210" height="440" rx="36" fill="url(#pixel-body)" stroke="#3F3F46" stroke-width="3"/>
  <rect x="99" y="34" width="202" height="432" rx="32" fill="#0A0A0C"/>
  
  <!-- Signature Pixel Camera Visor Bar -->
  <rect x="105" y="80" width="190" height="48" rx="24" fill="url(#visor-grad)" stroke="#52525B" stroke-width="2"/>
  
  <!-- Lenses inside Visor -->
  <rect x="120" y="92" width="90" height="24" rx="12" fill="#000" stroke="#00F0FF" stroke-width="1.5"/>
  <circle cx="138" cy="104" r="7" fill="#00F0FF" opacity="0.8"/>
  <circle cx="165" cy="104" r="7" fill="#00F0FF" opacity="0.8"/>
  <rect x="235" y="94" width="20" height="20" rx="4" fill="#000" stroke="#334155" stroke-width="1.5"/>
  
  <text x="200" y="430" fill="#A1A1AA" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">PIXEL 9 PRO XL</text>
</svg>
