<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="s25-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2129"/>
      <stop offset="50%" stop-color="#12161D"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="s25-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="camera-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Frame -->
  <rect x="90" y="30" width="220" height="440" rx="16" fill="url(#s25-body)" stroke="#334155" stroke-width="3"/>
  <rect x="94" y="34" width="212" height="432" rx="14" fill="#070A0E" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Screen Glow -->
  <rect x="98" y="38" width="204" height="424" rx="12" fill="url(#s25-screen)"/>
  
  <!-- Holepunch Camera -->
  <circle cx="200" cy="54" r="5" fill="#000" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Samsung Quad Camera Module Rear Reflection (Stylized) -->
  <g transform="translate(115, 60)">
    <circle cx="15" cy="20" r="14" fill="#000" stroke="url(#camera-lens)" stroke-width="2.5"/>
    <circle cx="15" cy="20" r="6" fill="#00F0FF" opacity="0.8"/>
    
    <circle cx="15" cy="58" r="14" fill="#000" stroke="url(#camera-lens)" stroke-width="2.5"/>
    <circle cx="15" cy="58" r="6" fill="#00F0FF" opacity="0.8"/>
    
    <circle cx="15" cy="96" r="14" fill="#000" stroke="url(#camera-lens)" stroke-width="2.5"/>
    <circle cx="15" cy="96" r="6" fill="#00F0FF" opacity="0.8"/>
    
    <circle cx="45" cy="38" r="9" fill="#000" stroke="#334155" stroke-width="2"/>
    <circle cx="45" cy="76" r="9" fill="#000" stroke="#334155" stroke-width="2"/>
  </g>
  
  <!-- S-Pen Hint -->
  <rect x="290" y="420" width="6" height="40" rx="3" fill="#00F0FF" opacity="0.8"/>
  <text x="200" y="430" fill="#94A3B8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">GALAXY S25 ULTRA</text>
</svg>
