<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="poco-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  
  <!-- Signature Racing Yellow Body -->
  <rect x="95" y="30" width="210" height="440" rx="28" fill="url(#poco-body)" stroke="#FACC15" stroke-width="2.5"/>
  <rect x="99" y="34" width="202" height="432" rx="24" fill="#A16207"/>
  
  <!-- Full Width Black Camera Island -->
  <rect x="105" y="55" width="190" height="110" rx="14" fill="#09090B" stroke="#27272A" stroke-width="2"/>
  <text x="245" y="85" fill="#FACC15" font-family="sans-serif" font-size="14" font-weight="900">POCO</text>
  
  <!-- Camera Lenses -->
  <circle cx="140" cy="90" r="12" fill="#000" stroke="#EAB308" stroke-width="2"/>
  <circle cx="180" cy="90" r="12" fill="#000" stroke="#EAB308" stroke-width="2"/>
  <circle cx="140" cy="130" r="12" fill="#000" stroke="#EAB308" stroke-width="2"/>
  <circle cx="180" cy="130" r="8" fill="#27272A"/>
  
  <text x="200" y="430" fill="#FEF08A" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">POCO X6 PRO 5G</text>
</svg>
